# Server
sv_name "TeeFrame"
sv_bind_address "0.0.0.0"
sv_port 8304
sv_register_on_master_server 0

# Access
sv_password ""
# Set a non-empty password to enable RCON.
sv_rcon_password ""
sv_rcon_max_tries 10
sv_rcon_ban_duration 5
sv_max_clients_per_ip 4
sv_server_info_replies_per_second 500

# sv_world_add <identifier> <map> <client_limit> <spectator_slots> [game_type] [config_file]
# client_limit includes spectator_slots.
sv_world_add "dm" "dm1" 64 0 "dm"
# sv_world_add "ctf" "ctf1" 24 4 "ctf" "ctf.cfg"

# Shared gameplay defaults. Per-world files can override these.
sv_world_join_as_spectator 0

sv_world_pvp_score_limit 5
sv_world_pvp_time_limit 0
sv_world_pvp_warmup 0
sv_world_pvp_team_damage 0

# Messages
sv_world_motd "Welcome to TeeFrame!"
sv_world_welcome ""

# Voting
sv_world_vote_kick 1
sv_world_vote_kick_min_players 0
sv_world_vote_kick_ban_duration 5
sv_world_vote_spectate 1
sv_world_vote_spectate_rejoin_delay 3
sv_world_vote_duration 25
sv_world_vote_delay 60
exec "votes.cfg"

# Logging: -3 none, -2 error, -1 warn, 0 info, 1 debug, 2 trace.
sv_log_file ""
sv_log_file_output_level 0
sv_console_output_level 0
sv_rcon_output_level 0

# Include another config, relative to this file:
# exec "private.cfg"
